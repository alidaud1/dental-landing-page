name: CI

# Pull requests only. Pushes to main are verified by deploy.yml, which builds
# the same code into the production image — running both would double the work
# for no extra signal.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Type-check, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so this covers type-checking too.
      - name: Build
        run: npm run build
        env:
          # Not a secret — the Web3Forms key only permits sending to the one
          # address registered against it. Set it as a repository variable so
          # production builds carry it. Builds still succeed when it is empty;
          # the form just falls back to demo mode.
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}

      - name: Verify the image builds
        run: docker build -t ci-check .
