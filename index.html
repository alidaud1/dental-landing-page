<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f5f5c" />

    <title>Jaskani Dental Clinic | Dental Care in G-13, Islamabad</title>
    <meta
      name="description"
      content="Family dental care in G-13, Islamabad. Consultations, scaling, fillings, root canal treatment, crowns, dentures and whitening — explained clearly before you decide. Open daily until 10 PM."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!--
      No canonical tag: the production domain has not been confirmed. Add
      <link rel="canonical" href="https://your-domain/"> and the matching
      og:url once the site has a final address.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jaskani Dental Clinic" />
    <meta property="og:title" content="Jaskani Dental Clinic | Dental Care in G-13, Islamabad" />
    <meta
      property="og:description"
      content="Family dental care in G-13, Islamabad — explained clearly before you decide. Open daily until 10 PM."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:alt" content="The treatment room at Jaskani Dental Clinic in G-13, Islamabad" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: preconnect first, two families, display=swap to avoid blocking render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
    />

    <!--
      LocalBusiness/Dentist structured data.
      Only fields that are present on the clinic's own website are included.
      Deliberately omitted because they are unverified: aggregateRating,
      review, geo coordinates, priceRange, founder, employee, sameAs.
      Do not add them without confirmation from the clinic.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Jaskani Dental Clinic",
        "description": "A family dental clinic in G-13, Islamabad offering preventive, restorative and cosmetic treatments.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Street 87, G-13/1",
          "addressLocality": "Islamabad",
          "postalCode": "44034",
          "addressCountry": "PK"
        },
        "telephone": "+923151932127",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "closes": "22:00"
          }
        ],
        "availableService": [
          { "@type": "MedicalProcedure", "name": "Dental Consultation" },
          { "@type": "MedicalProcedure", "name": "Scaling & Polishing" },
          { "@type": "MedicalProcedure", "name": "Oral Prophylaxis" },
          { "@type": "MedicalProcedure", "name": "Fluoride Treatment" },
          { "@type": "MedicalProcedure", "name": "Tooth & Composite Filling" },
          { "@type": "MedicalProcedure", "name": "Root Canal Treatment" },
          { "@type": "MedicalProcedure", "name": "Tooth Extraction" },
          { "@type": "MedicalProcedure", "name": "Crown & Bridge" },
          { "@type": "MedicalProcedure", "name": "Dentures" },
          { "@type": "MedicalProcedure", "name": "Teeth Whitening" },
          { "@type": "MedicalProcedure", "name": "Smile Design" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
