# nginx config INSIDE the container. The host nginx handles TLS, the domain
# and HTTP->HTTPS redirect; this one only serves files on loopback.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The host proxy sets X-Forwarded-For; log the real client, not the proxy.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ---- Compression ----------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ---- Caching --------------------------------------------------------
    # Vite fingerprints everything under /assets/ (index-ABC123.js,
    # photo-XYZ789.webp), so those are safe to cache forever. index.html must
    # NEVER be cached that way, or visitors keep loading an old page that
    # references asset files the next deploy deleted.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ---- Routing --------------------------------------------------------
    # Single-page app: unknown paths fall back to index.html so the site is
    # ready if routes are ever added. Today everything lives on "/".
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # Nothing here should ever be fetched; deny quietly rather than 404-ing.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
